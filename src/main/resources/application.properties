spring.application.name=hospital-management-system

# Server Configuration
server.port=${PORT:9999}

# TiDB Cloud PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://27j9ptij2bb0u64x.gateway01.us-east-1.prod.aws.pg.tidbcloud.com:5432/postgres?sslmode=require}
spring.datasource.username=${DATABASE_USERNAME:27j9ptij2bb0u64x.postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Disable automatic schema updates because TiDB does not support
# all PostgreSQL metadata functions used by Hibernate 6.6.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration=86400000
jwt.secret=${JWT_SECRET}

# File Storage
app.upload.dir=uploads/lab-reports

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000